# Project properties & versions
mod_group=net.player005.recipe_modification
mod_id=recipe_modification
mod_name=Recipe Modification Lib
mod_authors=Player005
mod_version=0.1.4
mod_description=A library mod to allow automatically applying arbitrary modifications to all recipes at runtime in a simple way.

# The license for your mod - see https://choosealicense.com/
mod_license=Polyform Shield

java_version=25

# The minecraft version used for compiling and testing
minecraft_version=26.1.2
# Minecraft 26.1.2 is distributed unobfuscated; Loom must skip remapping.
fabric.loom.disableObfuscation=true
# The minecraft version ranges for fabric.mod.json and neoforge.mods.toml respectively
mc_versions_fabric=26.1.2
mc_versions_neo=[26.1.2]

# The neoforge version used for compiling and testing
neoforge_version=26.1.2.94
# range of allowed neo loader versions (used in neoforge.mods.toml)
neo_loader_version_range=*

# check these versions on https://fabricmc.net/develop/
fabric_loader_version=0.19.3
# if you don't need fabric api, you can remove this line as well as the one in fabric/build.gradle.kts
fabric_api_version=0.155.2+26.1.2

# Done to improve gradle performance.
org.gradle.jvmargs=-Xms500M -Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
#org.gradle.configuration-cache=true
